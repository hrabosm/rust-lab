[package]
name = "rust-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
